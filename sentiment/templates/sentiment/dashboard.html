<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Sentiment Analyzer
        </a>

        <div>

            <span class="text-white me-3">
                Welcome, {{ request.user.username }}
            </span>

            <a
                href="/"
                class="btn btn-outline-light me-2">

                Analyze

            </a>

            <a
                href="{% url 'history' %}"
                class="btn btn-outline-light me-2">

                History

            </a>

            <a
                href="{% url 'logout' %}"
                class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="text-center mb-4">
        Sentiment Dashboard
    </h2>


    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Total Analyses</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Positive</h5>
                    <h2 class="text-success">
                        {{ positive }}
                    </h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Negative</h5>
                    <h2 class="text-danger">
                        {{ negative }}
                    </h2>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Neutral</h5>
                    <h2 class="text-secondary">
                        {{ neutral }}
                    </h2>
                </div>
            </div>
        </div>

    </div>


    <div class="card shadow mt-5">
        <div class="card-body">

            <h4 class="text-center mb-4">
                Sentiment Distribution
            </h4>

            <div style="height: 400px;">
                <canvas id="sentimentChart"></canvas>
            </div>

        </div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const chartElement = document.getElementById("sentimentChart");

    const positiveCount = Number("{{ positive|default:0 }}");
    const negativeCount = Number("{{ negative|default:0 }}");
    const neutralCount = Number("{{ neutral|default:0 }}");

    new Chart(chartElement, {
        type: "bar",

        data: {
            labels: [
                "Positive",
                "Negative",
                "Neutral"
            ],

            datasets: [
                {
                    label: "Number of Analyses",

                    data: [
                        positiveCount,
                        negativeCount,
                        neutralCount
                    ]
                }
            ]
        },

        options: {
            responsive: true,

            maintainAspectRatio: false,

            scales: {
                y: {
                    beginAtZero: true,

                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });
</script>

</body>
</html>
